# =============================================================================
# Global Configuration - Multimodal Banglish Classroom Summarizer
# =============================================================================

# Project Metadata
project:
  name: "Multimodal Banglish Classroom Summarizer"
  version: "1.0.0"
  author: "Master's Thesis"

# Hardware Configuration
hardware:
  device: "cuda"
  gpu_memory_fraction: 0.9  # Use 90% of GPU memory max
  mixed_precision: true

# Model Configuration
models:
  # Speech Recognition (Whisper)
  asr:
    name: "openai/whisper-large-v3-turbo"
    precision: "float16"
    language: null  # Auto-detect (avoid forced language to prevent hallucinations)
    task: "transcribe"
    chunk_length_s: 30
    # ~3GB VRAM - fast and accurate for Banglish
  
  # Vision Language Model (Whiteboard Text Extraction)
  vlm:
    name: "Qwen/Qwen2.5-VL-7B-Instruct"
    precision: "float16"  # ~15GB VRAM on RTX 3090
    max_new_tokens: 1024
  
  # Summarization LLM (Multimodal Fusion)
  llm:
    name: "Qwen/Qwen2.5-7B-Instruct"
    precision: "float16"  # ~14GB VRAM (use 4bit in live mode)
    max_new_tokens: 4096
    temperature: 0.7
    top_p: 0.9
  
  # Pose Estimation (Gaze Tracking)
  pose:
    name: "yolov8n-pose"
    precision: "float32"
    # ~0.5GB VRAM - lightweight

# Audio Processing
audio:
  sample_rate: 16000
  chunk_duration_sec: 30
  overlap_sec: 2
  denoise: false

# Vision Processing
vision:
  frame_extraction:
    interval_sec: 30  # Extract 1 frame per N seconds
    resize_width: 1280
  whiteboard_detection:
    min_area_ratio: 0.1
    blur_threshold: 100

# Evaluation Settings
evaluation:
  fuzzy_threshold: 85  # Minimum fuzzy match score for TTR
  enable_wer: true

# Output Configuration
output:
  format: "markdown"
  include_timestamps: true
  include_code_blocks: true

# Paths (relative to project root)
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  outputs: "output"
  logs: "experiments/logs"
  checkpoints: "experiments/checkpoints"
